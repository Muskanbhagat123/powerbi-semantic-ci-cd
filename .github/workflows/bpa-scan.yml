name: Semantic Model BPA Gatekeeper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bpa-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Extract Tabular Editor CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/TabularEditor/TabularEditor/releases/latest/download/TabularEditor.Portable.zip" -OutFile "TabularEditor.zip"
          Expand-Archive -Path "TabularEditor.zip" -DestinationPath "./TE"

      - name: Run Best Practice Analyzer (BPA)
        shell: pwsh
        run: |
          # Path to the Semantic Model definition folder
          $modelFolder = "./Enterprise_Semantic_Model.SemanticModel/definition"
          
          # Run Tabular Editor BPA check
          $output = ./TE/TabularEditor.exe "$modelFolder" -B "./bpa-rules.json" -V
          Write-Output $output

          # Fail if violations are found
          if ($output -match "violation" -or $output -match "failed") {
            Write-Error "Best Practice Analyzer rule violations detected!"
            exit 1
          } else {
            Write-Host "All Best Practice rules passed successfully!"
          }