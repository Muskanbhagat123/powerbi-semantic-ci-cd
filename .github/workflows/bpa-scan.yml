name: Semantic Model BPA Gatekeeper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bpa-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Tabular Editor 3 CLI
        shell: pwsh
        run: |
          dotnet tool install -g TabularEditor3.Utils

      - name: Run Best Practice Analyzer (BPA) on TMDL
        shell: pwsh
        run: |
          $modelFolder = "./Enterprise_Semantic_Model.SemanticModel/definition"
          
          # Run TE3 CLI Best Practice Analyzer with strict check
          te3 scan "$modelFolder" -r "./bpa-rules.json" --fail-on-warning